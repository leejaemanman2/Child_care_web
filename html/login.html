<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/base.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <!-- 공통 CSS가 나중에 생기더라도 우선은 없어도 동작합니다 -->
</head>

<body>
    <header class="container">
        <h1>ChildCare</h1>
        <nav><a href="/html/index.html">홈</a> · <a href="/html/signup.html">회원가입</a> · <a id="nav-login"
                href="/html/login.html">로그인</a></nav>
    </header>

    <main class="container" style="max-width:480px;margin:32px auto;">
        <h2>로그인</h2>
        <form id="loginForm">
            <label>이메일<br />
                <input type="email" id="loginEmail" required placeholder="you@example.com" />
            </label><br /><br />
            <label>비밀번호<br />
                <input type="password" id="loginPassword" required minlength="8" />
            </label><br /><br />
            <button type="submit">로그인</button>
        </form>
    </main>

    <footer class="container" style="margin:32px auto;">© ChildCare</footer>
    <script defer src="/js/auth.js"></script>
    <div id="toast"></div>

    <!-- Toast Container -->
    <div id="toast" style="
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:10px 16px;border-radius:8px;
  display:none;z-index:1000;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);
"></div>


</body>

</html>
