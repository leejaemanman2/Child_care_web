<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/base.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아기 프로필 목록</title>

    <!-- fast guard: 로그인 안 했으면 곧바로 로그인 페이지로 -->
    <script>
        (function () {
            try {
                // auth.js의 setAuth가 저장한 키: 'auth'  (JSON 문자열)
                var auth = localStorage.getItem('auth');
                if (!auth) {
                    window.location.replace('/html/login.html');
                }
            } catch (e) {
                window.location.replace('/html/login.html');
            }
        })();
    </script>

</head>

<body>
    <header class="container">
        <h1>ChildCare</h1>
        <nav><a href="/html/index.html">홈</a> · <a id="nav-login" href="/html/login.html">로그인</a></nav>
    </header>

    <main class="container" style="max-width:960px;margin:24px auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h2>아기 프로필</h2>
            <a href="/html/profile-edit.html"><button>+ 새 프로필</button></a>
        </div>

        <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <div>
                총 <strong id="count">0명</strong>
                <input id="q" type="search" placeholder="이름/알레르기 검색" style="margin-left:10px;">
                <select id="sort" style="margin-left:8px;">
                    <option value="createdAt_desc">최근 추가 순</option>
                    <option value="name_asc">이름순</option>
                    <option value="birth_asc">생일순</option>
                </select>
            </div>

            <div style="display:flex;gap:8px;align-items:center;">
                <button id="exportProfiles">내보내기</button>
                <label class="btn-ghost" style="cursor:pointer;">
                    가져오기 <input type="file" id="importProfiles" accept="application/json" hidden>
                </label>
            </div>
        </div>

        <div id="profileList"></div>

        <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;">
            <button id="prev">이전</button>
            <span id="pageInfo">1 / 1</span>
            <button id="next">다음</button>
        </div>

    </main>

    <footer class="container" style="margin:32px auto;">© ChildCare</footer>

    <script defer src="/js/auth.js"></script>
    <script defer src="/js/profile.js"></script>

    <script defer src="/js/auth.js"></script>
    <script>
        // 보조 가드 (fast guard가 실패했을 때 대비)
        document.addEventListener('DOMContentLoaded', function () {
            try {
                // auth.js에 getAuth()가 있다면 그걸 써도 됨: if (!getAuth()) { ... }
                var auth = localStorage.getItem('auth');
                if (!auth) {
                    alert('로그인 후 이용 가능합니다.');
                    location.href = '/html/login.html';
                }
            } catch (e) {
                location.href = '/html/login.html';
            }
        });
    </script>
    <div id="toast" style="
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:10px 16px;border-radius:8px;
  display:none;z-index:1000;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);
"></div>


</body>

</html>
